AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SmartPark MVP — serverless backend (API Gateway + Lambda + DynamoDB + Bedrock)

# ---------------------------------------------------------------------------
# Parameters — values supplied at deploy time without editing the template.
# ---------------------------------------------------------------------------
Parameters:
  BedrockModelId:
    Type: String
    Description: >-
      Bedrock model ID (or inference profile ID) used for recommendation
      explanations, passed to the Converse API at runtime. For the current
      deployment this is the US cross-region inference profile
      "us.anthropic.claude-haiku-4-5-20251001-v1:0".
    Default: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  BedrockFoundationModelId:
    Type: String
    Description: >-
      The underlying foundation-model ID (without the "us." inference-profile
      prefix). Used only to scope the IAM policy to the specific foundation
      model the US inference profile routes to. Keep in sync with
      BedrockModelId.
    Default: "anthropic.claude-haiku-4-5-20251001-v1:0"
  ParkingBufferMinutes:
    Type: String
    Description: Minutes reserved for finding a spot after arriving at the lot.
    Default: "5"
  CorsAllowOrigin:
    Type: String
    Description: >-
      Origin allowed by CORS. "*" is fine for local development; set this to
      the deployed Amplify frontend origin (e.g. https://main.xxxx.amplifyapp.com)
      in production. Used for both the Lambda response header and the API
      Gateway OPTIONS preflight.
    Default: "*"

# ---------------------------------------------------------------------------
# Global settings applied to all Serverless functions.
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Timeout: 15          # seconds — generous for a Bedrock round-trip
    MemorySize: 256

Resources:

  # -------------------------------------------------------------------------
  # Task 11.1 — DynamoDB table.
  # Single-table design, on-demand billing. PK = partition, SK = sort.
  # -------------------------------------------------------------------------
  SmartParkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: smartpark
      BillingMode: PAY_PER_REQUEST     # on-demand — no provisioned capacity to manage
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH                # partition key
        - AttributeName: SK
          KeyType: RANGE               # sort key

  # -------------------------------------------------------------------------
  # Task 11.2 — Lambda function, environment variables, and IAM permissions.
  # -------------------------------------------------------------------------
  RecommendationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smartpark-recommend
      CodeUri: ../backend/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref SmartParkTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          PARKING_BUFFER_MINUTES: !Ref ParkingBufferMinutes
          # Allowed CORS origin for the Lambda proxy response header.
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        # Least-privilege: READ-ONLY access scoped to the SmartPark table only.
        # The Lambda never writes to DynamoDB (seeding is a separate script).
        - DynamoDBReadPolicy:
            TableName: !Ref SmartParkTable
        # Permission to invoke Bedrock for explanation generation only,
        # scoped to the Claude Haiku 4.5 US inference profile and the specific
        # foundation-model ARNs that the US profile routes to. The Converse
        # API authorizes under bedrock:InvokeModel /
        # bedrock:InvokeModelWithResponseStream. Least privilege — no wildcard
        # model access.
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                # The US cross-region inference profile (this stack's region).
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                # Foundation-model ARNs the US profile can route to.
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/${BedrockFoundationModelId}"
                - !Sub "arn:aws:bedrock:us-east-2::foundation-model/${BedrockFoundationModelId}"
                - !Sub "arn:aws:bedrock:us-west-2::foundation-model/${BedrockFoundationModelId}"
      Events:
        # Task 11.3 — API Gateway route declared as an event source.
        Recommend:
          Type: Api
          Properties:
            Path: /recommend
            Method: post
            RestApiId: !Ref SmartParkApi

  # -------------------------------------------------------------------------
  # Task 11.3 — API Gateway REST API with CORS for the frontend.
  # -------------------------------------------------------------------------
  SmartParkApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type'"
        # Preflight (OPTIONS) allow-origin. Kept consistent with the Lambda
        # response header via the shared CorsAllowOrigin parameter. SAM requires
        # the value to be single-quoted, so wrap the parameter with !Sub.
        AllowOrigin: !Sub "'${CorsAllowOrigin}'"

# ---------------------------------------------------------------------------
# Outputs — printed after deploy for convenience.
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Public URL for the SmartPark recommend endpoint
    Value: !Sub "https://${SmartParkApi}.execute-api.${AWS::Region}.amazonaws.com/prod/recommend"
  TableName:
    Description: DynamoDB table name
    Value: !Ref SmartParkTable
